<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plot 01 pixel gap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: quiet field station
   IDEA: looking down into one sunlit gap in a mixed forest, as living pixel art
   PICTURE: the 3D scene, full screen, rendered at low resolution
   COLOUR and TYPE: forest greens and warm sun from the scene; Pixelify Sans labels on dark glass
   LAYOUT: scene edge to edge, one small label top-left, hint bottom */
:root{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;background:#17241a;overflow:hidden;font-family:"Pixelify Sans",system-ui,sans-serif;color:#efe9d8}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none;outline:none}
.tag{position:fixed;top:16px;left:16px;padding:10px 14px 11px;background:rgba(14,20,14,.78);border:2px solid #d8c99a;box-shadow:4px 4px 0 rgba(0,0,0,.35);max-width:calc(100vw - 32px)}
.tag b{display:block;font-size:22px;font-weight:600;letter-spacing:.02em}
.tag span{display:block;font-size:14px;color:#c9c1a8;margin-top:2px}
.hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:14px;color:#d8d0b6;text-shadow:2px 2px 0 rgba(0,0,0,.6)}
.bar{position:fixed;left:16px;bottom:44px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100vw - 32px)}
.bar button{font:inherit;font-size:15px;color:#efe9d8;background:rgba(14,20,14,.82);border:2px solid #6f7a5a;padding:7px 11px 8px;min-height:40px;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.35)}
.bar button:hover{border-color:#d8c99a}.bar button:focus-visible{outline:2px solid #ffd76a;outline-offset:2px}
.bar button[aria-pressed=true]{background:#d8c99a;color:#17241a;border-color:#d8c99a}
.bar .sep{width:6px}
.bar select{font:inherit;font-size:15px;color:#efe9d8;background:rgba(14,20,14,.82);border:2px solid #6f7a5a;padding:7px 8px 8px;min-height:40px;box-shadow:3px 3px 0 rgba(0,0,0,.35);cursor:pointer}
.bar select:hover{border-color:#d8c99a}.bar select:focus-visible{outline:2px solid #ffd76a;outline-offset:2px}
@media (max-width:600px){.bar{bottom:40px}.bar button,.bar select{font-size:13px;padding:6px 8px}.hint{font-size:12px}}
</style>
</head>
<body>
<div id="app" aria-label="Pixel-art view of a sunlit gap in a mixed forest"></div>
<div class="tag"><b>Plot 01 · 60 × 60 m</b><span>Old beech wood, spruce plantation and a spring · June evening, year 3</span></div>
<div class="bar" role="toolbar" aria-label="Camera">
  <button data-view="overview" aria-pressed="true">Overview</button>
  <select data-follow aria-label="Follow an animal"><option value="">Follow…</option></select>
  <span class="sep"></span>
  <button data-rot="-1" aria-label="Rotate left">⟲</button>
  <button data-rot="1" aria-label="Rotate right">⟳</button>
  <span class="sep"></span>
  <button data-canopy aria-pressed="true" title="Show or hide the tree crowns">Canopy</button>
  <select data-goto aria-label="Go to a habitat">
    <option value="">Go to…</option>
    <option value="0.5,1,1.6">Canopy gap</option>
    <option value="-8,-6,1.4">Old beech–oak wood</option>
    <option value="-12,-13,2.2">Charcoal platform</option>
    <option value="7.4,-14,2.6">Badger sett</option>
    <option value="11,-6,2.2">Stone wall</option>
    <option value="16,-11,1.6">Spruce plantation</option>
    <option value="16,5,1.8">Windthrow</option>
    <option value="15,15,1.8">Pioneer edge</option>
    <option value="20,23.5,1.8">Hedge</option>
    <option value="18,27.5,2">Meadow strip</option>
    <option value="-8,13,1.8">Spring and stream</option>
    <option value="-20,4,1.6">Rock outcrop</option>
  </select>
</div>
<div class="hint">Drag to move · right-drag or two fingers to rotate and tilt · scroll to zoom · WASD to move, Q/E to rotate</div>
<script src="main.js"></script>
</body>
</html>
