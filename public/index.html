<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16201a">
<title>DeadWood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* The world is pixel art; the interface is not. Frosted glass over the scene, the system font (SF Pro on Apple
   devices, Inter elsewhere), quiet hierarchy, a single warm accent taken from the low evening sun. */
:root{
  color-scheme:dark;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,system-ui,sans-serif;
  --glass:rgba(24,28,26,.52);--glass-strong:rgba(26,30,28,.78);--hairline:rgba(255,255,255,.14);--hairline-soft:rgba(255,255,255,.07);
  --text:#f7f6f2;--text-2:rgba(247,246,242,.66);--text-3:rgba(247,246,242,.42);
  --accent:#f4c56e;--accent-soft:rgba(244,197,110,.18);--danger:#ff7a5c;
  --r-sm:12px;--r-md:18px;--r-lg:26px;
  --shadow:0 18px 50px rgba(0,0,0,.28),0 2px 8px rgba(0,0,0,.18);
  --blur:saturate(170%) blur(22px);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#16201a;overflow:hidden;font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none;outline:none}
button{font:inherit;color:inherit}
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:.5px solid var(--hairline);box-shadow:var(--shadow),inset 0 .5px 0 rgba(255,255,255,.12)}

/* place card */
.place{position:fixed;top:calc(16px + var(--safe-t));left:16px;max-width:min(380px,calc(100vw - 32px - 184px));padding:12px 16px 13px;border-radius:var(--r-md);transition:opacity .25s}
.place .row{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.place h1{margin:0;font-size:17px;font-weight:600;line-height:1.25;letter-spacing:-.02em}
.place p{margin:4px 0 0;font-size:13px;line-height:1.38;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.place.flagged .chip{background:rgba(255,122,92,.18);color:var(--danger)}

/* dock */
.dock{position:fixed;left:50%;bottom:calc(18px + var(--safe-b));transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;border-radius:22px;z-index:3}
.dock .sep{width:.5px;height:26px;background:var(--hairline);margin:0 4px}
.ib{position:relative;display:grid;place-items:center;width:46px;height:46px;border:0;border-radius:16px;background:transparent;color:var(--text);cursor:pointer;transition:background .15s,color .15s,transform .12s}
.ib:hover{background:rgba(255,255,255,.08)}
.ib:active{transform:scale(.94)}
.ib:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}
.ib[aria-expanded=true]{background:rgba(255,255,255,.12)}
.ib .tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(4px);padding:5px 9px;border-radius:9px;background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:.5px solid var(--hairline);font-size:12px;font-weight:500;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
@media (hover:hover){.ib:hover .tip{opacity:1;transform:translateX(-50%) translateY(0)}}
.ib[aria-expanded=true] .tip{opacity:0!important}

/* popover menus */
.pop{position:fixed;z-index:6;width:280px;max-height:min(440px,62vh);overflow:auto;padding:6px;border-radius:var(--r-md);background:var(--glass-strong);transform-origin:bottom center;opacity:0;transform:scale(.96) translateY(6px);pointer-events:none;transition:opacity .16s,transform .18s cubic-bezier(.2,.8,.2,1);scrollbar-width:thin}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.pop h3{margin:6px 10px 6px;font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em}
.pop .item{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border:0;border-radius:12px;background:transparent;text-align:left;cursor:pointer}
.pop .item:hover,.pop .item:focus-visible{background:rgba(255,255,255,.08);outline:none}
.pop .ico{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.08)}
.pop .ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pop .lbl{font-size:15px;font-weight:500}
.pop .sub{display:block;font-size:12px;color:var(--text-2);margin-top:1px}
.pop .flag{margin-left:auto;font-size:11px;font-weight:600;color:var(--danger)}

/* season control (top centre) */
.clock{position:fixed;top:calc(16px + var(--safe-t));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 6px 6px 8px;border-radius:20px;z-index:3}
.clock .dial{width:34px;height:34px;flex:none}.clock .dial .track{fill:none;stroke:rgba(255,255,255,.14);stroke-width:2.4}.clock .dial .arc{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round}.clock .dial .hand{fill:var(--text)}
.clock .yr{display:flex;flex-direction:column;padding:0 6px 0 2px;line-height:1.15;min-width:118px}.clock .yr b{font-size:16px;font-weight:650;letter-spacing:-.01em}.clock .yr span{font-size:11px;color:var(--text-2);font-variant-numeric:tabular-nums}
.clock button{height:34px;padding:0 13px;border:0;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
.clock .next{background:var(--accent);color:#1d1a12}.clock .next:hover{filter:brightness(1.06)}.clock .next:disabled{background:rgba(255,255,255,.12);color:var(--text-2);cursor:default}
.clock .auto{background:rgba(255,255,255,.08);color:var(--text-2)}.clock .auto[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}
.clock.running .dial .hand{fill:var(--accent)}
.pill{top:calc(76px + var(--safe-t))!important}
.season-card{position:fixed;top:calc(76px + var(--safe-t));left:50%;width:min(340px,calc(100vw - 32px));padding:14px 16px;border-radius:var(--r-md);z-index:3;opacity:0;transform:translate(-50%,-6px);pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1)}
.season-card.open{opacity:1;transform:translate(-50%,0)}
.season-card .eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}.season-card h3{margin:2px 0 6px;font-size:17px;font-weight:650}
.season-card ul{margin:0;padding-left:16px;font-size:13px;line-height:1.45;color:var(--text)}
/* inspect card */
.inspect{position:fixed;left:16px;bottom:calc(92px + var(--safe-b));width:300px;max-width:calc(100vw - 32px);padding:16px 18px 14px;border-radius:var(--r-md);z-index:4;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .18s,transform .22s cubic-bezier(.2,.8,.2,1)}
.inspect.open{opacity:1;transform:none;pointer-events:auto}
.inspect .x{position:absolute;top:10px;right:10px;display:grid;place-items:center;width:28px;height:28px;border:0;border-radius:50%;background:rgba(255,255,255,.1);cursor:pointer}.inspect .x svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.inspect .eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.inspect h2{margin:2px 0 0;font-size:20px;font-weight:650;letter-spacing:-.02em}.inspect .sci{font-style:italic;font-size:13px;color:var(--text-2)}
.inspect .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}.inspect .grid b{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}.inspect .grid span{font-size:11px;color:var(--text-2)}
.inspect .growth span{font-size:12px;color:var(--text-2)}.inspect .growth .bar{height:6px;border-radius:999px;background:rgba(255,255,255,.1);margin:5px 0 3px;overflow:hidden}.inspect .growth .bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}.inspect .growth em{font-style:normal;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.inspect p{margin:10px 0 0;font-size:13px;line-height:1.4;color:var(--text)}
@media (max-width:640px){.inspect{bottom:calc(140px + var(--safe-b));width:calc(100vw - 32px)}.clock{top:auto;bottom:calc(84px + var(--safe-b))}.clock .yr{min-width:0}.pill{top:calc(16px + var(--safe-t))!important}.season-card{top:auto;bottom:calc(140px + var(--safe-b))}}
/* arriving veil: covers a jump until every tile in view is at full detail */
.veil{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:rgba(18,26,20,.55);-webkit-backdrop-filter:blur(28px) saturate(140%);backdrop-filter:blur(28px) saturate(140%);opacity:0;pointer-events:none;transition:opacity .45s ease}
.veil.on{opacity:1;pointer-events:auto;transition:opacity .12s ease}
.veil-card{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 13px;border-radius:999px;font-size:13px;font-weight:500;color:var(--text-2)}
/* loading pill and hint toast */
.pill{position:fixed;top:calc(16px + var(--safe-t));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px 12px 7px 10px;border-radius:999px;font-size:12px;font-weight:500;color:var(--text-2);opacity:0;transition:opacity .3s;pointer-events:none}
.pill.on{opacity:1}
.spin{width:12px;height:12px;border-radius:50%;border:1.6px solid rgba(255,255,255,.22);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translateX(-50%);padding:8px 14px;border-radius:999px;font-size:13px;color:var(--text-2);white-space:nowrap;transition:opacity .6s;pointer-events:none}
.toast.off{opacity:0}
.toast kbd{font-family:var(--font);font-size:11px;font-weight:600;color:var(--text);padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.1);border:.5px solid var(--hairline)}

@media (max-width:640px){
  .place{max-width:calc(100vw - 32px - 132px);padding:10px 13px 11px}
  .place h1{font-size:15px}.place p{font-size:12px}
  .ib{width:42px;height:42px;border-radius:14px}
  .dock{gap:2px;padding:5px}
  .toast{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app" aria-label="A 1 km forest estate in Central Europe, shown as 3D pixel art and streamed tile by tile"></div>
<script src="estate.js"></script>
</body>
</html>
